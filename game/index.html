<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💜</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #1e0a3c 0%, #3b1a6e 40%, #6d28d9 80%, #9d4fd6 100%);
    min-height: 100vh;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    position: relative;
  }

  /* Starfield */
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.4); }
  }

  /* HUD */
  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 100;
    background: rgba(91,45,142,0.5);
    backdrop-filter: blur(14px);
    border-bottom: 1.5px solid rgba(196,181,253,0.3);
  }
  .title {
    font-family: 'Pacifico', cursive;
    font-size: clamp(14px, 3.5vw, 22px);
    color: #e9d5ff;
    text-shadow: 0 0 18px rgba(196,181,253,0.7);
  }
  #score-display {
    font-size: clamp(14px, 2.5vw, 18px);
    font-weight: 800;
    color: #e9d5ff;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #score-num {
    font-size: clamp(18px, 3.5vw, 26px);
    color: #f0abfc;
    text-shadow: 0 0 12px rgba(240,171,252,0.8);
    font-family: 'Pacifico', cursive;
  }
  #lives-display { display: flex; gap: 5px; align-items: center; }
  .life-icon {
    width: clamp(18px, 3vw, 24px);
    height: clamp(18px, 3vw, 24px);
    transition: all 0.3s;
    filter: drop-shadow(0 2px 6px rgba(192,132,252,0.6));
  }
  .life-icon.lost { opacity: 0.2; transform: scale(0.7); filter: grayscale(1); }

  /* Game area */
  #game-area {
    position: fixed;
    top: 62px; left: 0; right: 0; bottom: 0;
    z-index: 1;
    overflow: hidden;
  }

  /* Player */
  #player {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(60px, 10vw, 85px);
    transition: left 0.04s linear;
    filter: drop-shadow(0 6px 18px rgba(196,181,253,0.6));
    animation: playerBob 2.2s ease-in-out infinite;
    z-index: 10;
  }
  @keyframes playerBob {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-6px); }
  }

  /* Falling items */
  .falling-item {
    position: absolute;
    top: -90px;
    animation: fall linear forwards;
    z-index: 5;
  }
  .falling-item svg { width: clamp(34px, 5.5vw, 50px); height: clamp(34px, 5.5vw, 50px); }
  @keyframes fall { to { top: 110vh; } }

  .falling-item.heart { animation-name: fallHeart; }
  @keyframes fallHeart {
    0%   { top: -90px; transform: rotate(-10deg); }
    25%  { transform: rotate(10deg); }
    50%  { transform: rotate(-10deg); }
    75%  { transform: rotate(10deg); }
    100% { top: 110vh; transform: rotate(-10deg); }
  }
  .falling-item.skull { animation-name: fallSkull; }
  @keyframes fallSkull {
    0%   { top: -90px; transform: scale(1); }
    50%  { transform: scale(1.1); }
    100% { top: 110vh; transform: scale(1); }
  }

  /* Particles */
  .particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: burst ease-out forwards;
    z-index: 20;
  }
  @keyframes burst {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }

  /* Score pop */
  .score-pop {
    position: fixed;
    font-family: 'Pacifico', cursive;
    font-size: 20px;
    color: #f0abfc;
    pointer-events: none;
    z-index: 30;
    text-shadow: 0 0 10px rgba(240,171,252,0.9);
    animation: scorePop 1s ease-out forwards;
    transform: translateX(-50%);
  }
  @keyframes scorePop {
    0%   { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
    100% { transform: translateX(-50%) translateY(-70px) scale(0.4); opacity: 0; }
  }

  /* Progress bar */
  #progress-wrap {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 7px;
    background: rgba(255,255,255,0.08);
    z-index: 50;
  }
  #progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #a855f7, #f0abfc);
    transition: width 0.4s ease;
    box-shadow: 0 0 12px rgba(240,171,252,0.8);
  }

  /* Overlay */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,5,35,0.75);
    backdrop-filter: blur(6px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  #overlay.show { opacity: 1; pointer-events: all; }

  .card {
    background: linear-gradient(145deg, #2d1058, #4a1d96);
    border: 2px solid rgba(196,181,253,0.35);
    border-radius: 28px;
    padding: 36px 28px 28px;
    width: min(360px, 90vw);
    text-align: center;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 40px rgba(124,58,237,0.3);
    transform: scale(0.8);
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    position: relative;
    overflow: hidden;
  }
  #overlay.show .card { transform: scale(1); }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 20%, rgba(196,181,253,0.08), transparent 60%);
    pointer-events: none;
  }
  .card-icon { margin-bottom: 10px; }
  .card h3 {
    font-family: 'Pacifico', cursive;
    font-size: clamp(16px, 4vw, 22px);
    color: #e9d5ff;
    margin-bottom: 12px;
    text-shadow: 0 0 20px rgba(196,181,253,0.4);
  }
  .card p {
    font-size: clamp(13px, 2.5vw, 15px);
    color: #c4b5fd;
    line-height: 1.7;
    margin-bottom: 22px;
    font-weight: 600;
  }
  .btn-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    position: relative;
    min-height: 48px;
    align-items: center;
  }
  .btn {
    padding: 12px 26px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 800;
    font-family: 'Nunito', sans-serif;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-yes {
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    color: white;
    box-shadow: 0 6px 20px rgba(124,58,237,0.5);
  }
  .btn-yes:hover { box-shadow: 0 10px 28px rgba(124,58,237,0.8); }
  .btn-no {
    background: rgba(255,255,255,0.08);
    color: #a78bfa;
    border: 1.5px solid rgba(196,181,253,0.25);
    position: absolute;
  }
  .btn-continue {
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    color: white;
    box-shadow: 0 6px 20px rgba(124,58,237,0.5);
  }

  /* Start screen */
  #start-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #1e0a3c, #3b1a6e, #6d28d9);
    z-index: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    transition: opacity 0.5s;
  }
  #start-screen.hide { opacity: 0; pointer-events: none; }
  .start-title {
    font-family: 'Pacifico', cursive;
    font-size: clamp(26px, 7vw, 50px);
    color: #e9d5ff;
    text-shadow: 0 0 30px rgba(196,181,253,0.7), 0 4px 30px rgba(124,58,237,0.5);
    margin-bottom: 8px;
    line-height: 1.2;
  }
  .start-sub {
    font-size: clamp(14px, 3vw, 17px);
    color: #c4b5fd;
    margin-bottom: 36px;
    font-weight: 600;
  }
  .start-instructions {
    display: flex;
    gap: 28px;
    margin-bottom: 36px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .instr-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(196,181,253,0.2);
    padding: 14px 20px;
    border-radius: 18px;
    backdrop-filter: blur(8px);
  }
  .instr-item span {
    font-size: 12px;
    color: #a78bfa;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .btn-start {
    background: linear-gradient(135deg, #7c3aed, #c084fc);
    color: white;
    border: none;
    padding: 16px 48px;
    border-radius: 50px;
    font-family: 'Pacifico', cursive;
    font-size: clamp(16px, 3vw, 21px);
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(124,58,237,0.6);
    transition: transform 0.2s, box-shadow 0.2s;
    letter-spacing: 0.5px;
  }
  .btn-start:hover { transform: scale(1.05); box-shadow: 0 12px 40px rgba(124,58,237,0.8); }

  /* Touch controls */
  #touch-controls {
    position: fixed;
    bottom: 18px;
    left: 0; right: 0;
    display: none;
    justify-content: space-between;
    padding: 0 22px;
    z-index: 50;
  }
  @media (max-width: 600px) {
    #touch-controls { display: flex; }
    #game-area { bottom: 90px; }
    #player { bottom: 14px; }
  }
  .touch-btn {
    width: 62px; height: 62px;
    border-radius: 50%;
    background: rgba(124,58,237,0.45);
    border: 2px solid rgba(196,181,253,0.35);
    display: flex; align-items: center; justify-content: center;
    color: #e9d5ff;
    font-size: 24px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    -webkit-tap-highlight-color: transparent;
  }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    pointer-events: none;
    z-index: 250;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- Start Screen -->
<div id="start-screen">
  <div class="start-title">For My Minimini 💜</div>
  <p class="start-sub">A little game made with lots of love ✨</p>
  <div class="start-instructions">
    <div class="instr-item">
      <svg width="46" height="46" viewBox="0 0 48 48" fill="none">
        <defs><radialGradient id="hg0" cx="40%" cy="30%" r="60%"><stop offset="0%" stop-color="#e879f9"/><stop offset="100%" stop-color="#7c3aed"/></radialGradient></defs>
        <path d="M24 40S6 28 6 16a10 10 0 0 1 20 0 10 10 0 0 1 20 0c0 12-18 24-18 24H24Z" fill="url(#hg0)"/>
        <path d="M14 14 Q18 10 22 14" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round" fill="none"/>
      </svg>
      <span>Catch Hearts</span>
    </div>
    <div class="instr-item">
      <svg width="46" height="46" viewBox="0 0 48 48" fill="none">
        <defs><radialGradient id="sg0" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#4c1d95"/><stop offset="100%" stop-color="#1e0a3c"/></radialGradient></defs>
        <ellipse cx="24" cy="21" rx="14" ry="15" fill="url(#sg0)"/>
        <ellipse cx="24" cy="21" rx="14" ry="15" stroke="#6d28d9" stroke-width="1.5"/>
        <rect x="14" y="33" width="6" height="9" rx="3" fill="#3b1a6e" stroke="#6d28d9" stroke-width="1.5"/>
        <rect x="21" y="33" width="6" height="9" rx="3" fill="#3b1a6e" stroke="#6d28d9" stroke-width="1.5"/>
        <rect x="28" y="33" width="6" height="9" rx="3" fill="#3b1a6e" stroke="#6d28d9" stroke-width="1.5"/>
        <circle cx="18" cy="20" r="5" fill="#0f0520"/><circle cx="30" cy="20" r="5" fill="#0f0520"/>
        <circle cx="19.5" cy="18.5" r="1.8" fill="rgba(196,181,253,0.7)"/><circle cx="31.5" cy="18.5" r="1.8" fill="rgba(196,181,253,0.7)"/>
      </svg>
      <span>Avoid Skulls</span>
    </div>
  </div>
  <button class="btn-start" onclick="startGame()">Let's Play 💜</button>
</div>

<!-- HUD -->
<div id="hud">
  <div class="title">For Malini 💜</div>
  <div id="score-display"><span>Hearts:</span><span id="score-num">0</span></div>
  <div id="lives-display"></div>
</div>

<!-- Game Area -->
<div id="game-area">
  <div id="player">
    <svg viewBox="0 0 80 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="basketG" x1="8" y1="22" x2="8" y2="54" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#4c1d95"/>
        </linearGradient>
      </defs>
      <ellipse cx="40" cy="57" rx="28" ry="5" fill="rgba(124,58,237,0.3)"/>
      <rect x="8" y="22" width="64" height="32" rx="10" fill="url(#basketG)"/>
      <line x1="24" y1="22" x2="24" y2="54" stroke="rgba(196,181,253,0.25)" stroke-width="2"/>
      <line x1="40" y1="22" x2="40" y2="54" stroke="rgba(196,181,253,0.25)" stroke-width="2"/>
      <line x1="56" y1="22" x2="56" y2="54" stroke="rgba(196,181,253,0.25)" stroke-width="2"/>
      <line x1="8" y1="35" x2="72" y2="35" stroke="rgba(196,181,253,0.25)" stroke-width="2"/>
      <path d="M22 22 Q40 2 58 22" stroke="#9d5ce5" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M22 22 Q40 2 58 22" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round" fill="none"/>
      <rect x="6" y="20" width="68" height="8" rx="4" fill="#9d5ce5"/>
      <path d="M34 40 Q36 36 38 40 Q40 36 42 40 L38 44 Z" fill="#f0abfc" opacity="0.9"/>
    </svg>
  </div>
</div>

<!-- Touch Controls -->
<div id="touch-controls">
  <div class="touch-btn" id="btn-left">◀</div>
  <div class="touch-btn" id="btn-right">▶</div>
</div>

<!-- Progress bar -->
<div id="progress-wrap"><div id="progress-bar"></div></div>

<!-- Overlay -->
<div id="overlay">
  <div class="card">
    <div class="card-icon" id="card-icon"></div>
    <h3 id="card-title"></h3>
    <p id="card-message"></p>
    <div class="btn-row" id="btn-row"></div>
  </div>
</div>

<script>
const TARGET_SCORE = 10;
const MAX_LIVES = 3;

let score = 0, lives = MAX_LIVES, gameRunning = false, playerX = window.innerWidth / 2;
let heartTimer, skullTimer;
let touchLeft = false, touchRight = false, touchInterval = null;

const player       = document.getElementById('player');
const scoreNum     = document.getElementById('score-num');
const livesDisplay = document.getElementById('lives-display');
const overlay      = document.getElementById('overlay');
const cardTitle    = document.getElementById('card-title');
const cardMsg      = document.getElementById('card-message');
const cardIcon     = document.getElementById('card-icon');
const btnRow       = document.getElementById('btn-row');
const progressBar  = document.getElementById('progress-bar');
const gameArea     = document.getElementById('game-area');

const loveMessages = [
  { title: "You're My Star ✨",   msg: "Malini, every heartbeat of mine whispers your name softly." },
  { title: "Always You 💜",       msg: "You are my favorite notification, Malini — always." },
  { title: "My World 🌙",         msg: "My world feels so perfect and whole when you're in it." },
  { title: "Forever 💜",          msg: "Malini, you are my today and all of my tomorrows." },
  { title: "Only You 💎",         msg: "If I had one heart, I'd give every piece only to you." },
  { title: "Sunshine ✨",          msg: "Malini, you're the reason I smile for absolutely no reason." },
  { title: "My Adventure 🗺️",     msg: "Loving you, Malini, is my favorite adventure of all." },
];

// Stars
(function(){
  const c = document.getElementById('stars');
  for(let i=0;i<80;i++){
    const s = document.createElement('div');
    s.className='star';
    const sz = Math.random()*3+1;
    s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-duration:${Math.random()*3+1.5}s;animation-delay:${Math.random()*4}s;`;
    c.appendChild(s);
  }
})();

function renderLives(){
  livesDisplay.innerHTML='';
  for(let i=0;i<MAX_LIVES;i++){
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 24 24');
    svg.classList.add('life-icon');
    if(i>=lives) svg.classList.add('lost');
    svg.innerHTML=`<path d="M12 21s-9-5.5-9-12a5 5 0 0 1 10 0 5 5 0 0 1 10 0c0 6.5-9 12-9 12z" fill="${i<lives?'#c084fc':'#444'}"/>`;
    livesDisplay.appendChild(svg);
  }
}

function setPlayerX(x){
  const half = player.offsetWidth/2;
  playerX = Math.max(half, Math.min(window.innerWidth-half, x));
  player.style.left = playerX+'px';
  player.style.transform = 'translateX(-50%)';
}

document.addEventListener('mousemove', e=>{ if(gameRunning) setPlayerX(e.clientX); });
gameArea.addEventListener('touchmove', e=>{ e.preventDefault(); if(gameRunning) setPlayerX(e.touches[0].clientX); }, {passive:false});

document.getElementById('btn-left').addEventListener('touchstart',()=>{ touchLeft=true; startTouch(); },{passive:true});
document.getElementById('btn-left').addEventListener('touchend',()=>{ touchLeft=false; stopTouch(); },{passive:true});
document.getElementById('btn-right').addEventListener('touchstart',()=>{ touchRight=true; startTouch(); },{passive:true});
document.getElementById('btn-right').addEventListener('touchend',()=>{ touchRight=false; stopTouch(); },{passive:true});
function startTouch(){ if(touchInterval) return; touchInterval=setInterval(()=>{ if(touchLeft) setPlayerX(playerX-10); if(touchRight) setPlayerX(playerX+10); },16); }
function stopTouch(){ if(!touchLeft&&!touchRight){ clearInterval(touchInterval); touchInterval=null; } }
document.addEventListener('keydown', e=>{ if(!gameRunning) return; if(e.key==='ArrowLeft') setPlayerX(playerX-30); if(e.key==='ArrowRight') setPlayerX(playerX+30); });

function heartSVG(id='h'){
  return `<svg viewBox="0 0 48 48" fill="none"><defs><radialGradient id="hg${id}" cx="40%" cy="30%" r="60%"><stop offset="0%" stop-color="#e879f9"/><stop offset="100%" stop-color="#7c3aed"/></radialGradient></defs><path d="M24 40S6 28 6 16a10 10 0 0 1 20 0 10 10 0 0 1 20 0c0 12-18 24-18 24H24Z" fill="url(#hg${id})"/><path d="M14 14 Q18 10 22 14" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round" fill="none"/><ellipse cx="24" cy="41" rx="8" ry="2.5" fill="rgba(124,58,237,0.2)"/></svg>`;
}
function skullSVG(){
  return `<svg viewBox="0 0 48 48" fill="none"><defs><radialGradient id="sg" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#4c1d95"/><stop offset="100%" stop-color="#1e0a3c"/></radialGradient></defs><ellipse cx="24" cy="21" rx="14" ry="15" fill="url(#sg)"/><ellipse cx="24" cy="21" rx="14" ry="15" stroke="#6d28d9" stroke-width="1.5"/><rect x="14" y="33" width="6" height="9" rx="3" fill="#3b1a6e" stroke="#6d28d9" stroke-width="1.5"/><rect x="21" y="33" width="6" height="9" rx="3" fill="#3b1a6e" stroke="#6d28d9" stroke-width="1.5"/><rect x="28" y="33" width="6" height="9" rx="3" fill="#3b1a6e" stroke="#6d28d9" stroke-width="1.5"/><circle cx="18" cy="20" r="5" fill="#0f0520"/><circle cx="30" cy="20" r="5" fill="#0f0520"/><circle cx="19.5" cy="18.5" r="1.8" fill="rgba(196,181,253,0.7)"/><circle cx="31.5" cy="18.5" r="1.8" fill="rgba(196,181,253,0.7)"/><path d="M20 27 Q24 29 28 27" stroke="#6d28d9" stroke-width="1.5" stroke-linecap="round" fill="none"/><ellipse cx="24" cy="43" rx="9" ry="2.5" fill="rgba(0,0,0,0.2)"/></svg>`;
}
function bigHeartSVG(){
  return `<svg width="72" height="72" viewBox="0 0 80 80" fill="none"><defs><radialGradient id="bh" cx="40%" cy="30%" r="70%"><stop offset="0%" stop-color="#e879f9"/><stop offset="100%" stop-color="#7c3aed"/></radialGradient></defs><path d="M40 68S8 48 8 28a16 16 0 0 1 32 0 16 16 0 0 1 32 0c0 20-32 40-32 40Z" fill="url(#bh)"/><path d="M22 24 Q30 17 37 24" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round" fill="none"/></svg>`;
}

let heartCount=0;
function spawnParticles(x,y){
  const colors=['#c084fc','#f0abfc','#a855f7','#e9d5ff','#7c3aed'];
  for(let i=0;i<12;i++){
    const p=document.createElement('div'); p.className='particle';
    const angle=(Math.PI*2*i)/12, dist=40+Math.random()*40;
    p.style.cssText=`left:${x}px;top:${y}px;width:${Math.random()*8+4}px;height:${Math.random()*8+4}px;background:${colors[~~(Math.random()*colors.length)]};--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;animation-duration:${0.5+Math.random()*0.4}s;`;
    document.body.appendChild(p); setTimeout(()=>p.remove(),900);
  }
}
function spawnScorePop(x,y){
  const el=document.createElement('div'); el.className='score-pop';
  el.textContent='+1 💜'; el.style.left=x+'px'; el.style.top=y+'px';
  document.body.appendChild(el); setTimeout(()=>el.remove(),1000);
}
function launchConfetti(){
  const cols=['#c084fc','#f0abfc','#a855f7','#e9d5ff','#7c3aed','#ffffff'];
  for(let i=0;i<60;i++){
    const c=document.createElement('div'); c.className='confetti-piece';
    const sz=Math.random()*10+6;
    c.style.cssText=`left:${Math.random()*100}%;width:${sz}px;height:${sz}px;background:${cols[~~(Math.random()*cols.length)]};border-radius:${Math.random()>0.5?'50%':'3px'};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*0.8}s;`;
    document.body.appendChild(c); setTimeout(()=>c.remove(),4000);
  }
}

function showCard({ icon='', title='', msg='', isFinal=false, isGameOver=false }){
  gameRunning=false;
  cardIcon.innerHTML=icon; cardTitle.textContent=title; cardMsg.textContent=msg; btnRow.innerHTML='';
  if(isFinal){
    launchConfetti();
    const yes=document.createElement('button'); yes.className='btn btn-yes'; yes.textContent='Yes, forever! 💍';
    yes.onclick=()=>{ cardTitle.textContent='💜 Best Day Ever! 💜'; cardMsg.textContent='Malini said YES! You two are meant to be! 🎉'; cardIcon.innerHTML=bigHeartSVG(); btnRow.innerHTML=''; launchConfetti(); };
    const no=document.createElement('button'); no.className='btn btn-no'; no.textContent='No 😅'; no.style.cssText='left:0;top:0;';
    const runAway=()=>{ const cw=no.parentElement.offsetWidth; no.style.left=Math.random()*(cw-80)+'px'; no.style.top=Math.random()*20+'px'; };
    no.addEventListener('mouseover',runAway);
    no.addEventListener('touchstart',e=>{ e.preventDefault(); runAway(); },{passive:false});
    btnRow.appendChild(yes); btnRow.appendChild(no);
  } else if(isGameOver){
    const r=document.createElement('button'); r.className='btn btn-yes'; r.textContent='Try Again 💜';
    r.onclick=()=>{ overlay.classList.remove('show'); resetGame(); };
    btnRow.appendChild(r);
  } else {
    const c=document.createElement('button'); c.className='btn btn-continue'; c.textContent='Keep Going 💜';
    c.onclick=()=>{ overlay.classList.remove('show'); gameRunning=true; };
    btnRow.appendChild(c);
  }
  overlay.classList.add('show');
}

function createFallingItem(type){
  const el=document.createElement('div'); el.className=`falling-item ${type}`;
  heartCount++;
  el.innerHTML = type==='heart' ? heartSVG(heartCount) : skullSVG();
  el.style.left = Math.random()*(window.innerWidth-60)+'px';
  el.style.animationDuration = (Math.random()*2+2.5)+'s';
  gameArea.appendChild(el);
  el.addEventListener('animationend',()=>{ el.remove(); clearInterval(check); });
  const check=setInterval(()=>{
    if(!gameRunning) return;
    const eR=el.getBoundingClientRect(), pR=player.getBoundingClientRect();
    if(!(eR.bottom<pR.top||eR.top>pR.bottom||eR.right<pR.left||eR.left>pR.right)){
      clearInterval(check); el.remove();
      const cx=(eR.left+eR.right)/2, cy=(eR.top+eR.bottom)/2;
      if(type==='heart'){
        score++; scoreNum.textContent=score; progressBar.style.width=(score/TARGET_SCORE*100)+'%';
        spawnParticles(cx,cy); spawnScorePop(cx,cy-20);
        if(score>=TARGET_SCORE){
          clearInterval(heartTimer); clearInterval(skullTimer);
          setTimeout(()=>showCard({ icon:bigHeartSVG(), title:'You collected all my love 💜', msg:'Malini, you gathered every piece of my heart... Will you be mine forever? 💍', isFinal:true }),400);
        } else {
          const m=loveMessages[~~(Math.random()*loveMessages.length)];
          setTimeout(()=>showCard({ icon:bigHeartSVG(), title:m.title, msg:m.msg }),200);
        }
      } else {
        lives--; renderLives();
        if(lives<=0){
          clearInterval(heartTimer); clearInterval(skullTimer);
          setTimeout(()=>showCard({ icon:skullSVG(), title:'A skull got you! 💀', msg:"Don't give up Malini! Try again and collect all my hearts 💜", isGameOver:true }),300);
        }
      }
    }
  },50);
}

function startGame(){
  const ss=document.getElementById('start-screen');
  ss.classList.add('hide');
  setTimeout(()=>{ ss.style.display='none'; },500);
  resetGame();
}

function resetGame(){
  score=0; lives=MAX_LIVES;
  scoreNum.textContent='0'; progressBar.style.width='0%';
  renderLives(); setPlayerX(window.innerWidth/2);
  document.querySelectorAll('.falling-item').forEach(e=>e.remove());
  clearInterval(heartTimer); clearInterval(skullTimer);
  gameRunning=true;
  heartTimer=setInterval(()=>{ if(gameRunning) createFallingItem('heart'); },1300);
  skullTimer=setInterval(()=>{ if(gameRunning) createFallingItem('skull'); },2400);
}

renderLives();
setPlayerX(window.innerWidth/2);
</script>
</body>
</html>
